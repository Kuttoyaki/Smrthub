<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register | Smartwatch Promo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 🔹 Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="index.html">⌚ Smartwatch Promo</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="apple.html">Apple</a></li>
          <li class="nav-item"><a class="nav-link" href="garmin.html">Garmin</a></li>
          <li class="nav-item"><a class="nav-link" href="huawei.html">Huawei</a></li>
          <li class="nav-item"><a class="nav-link active" href="register.html">ลงทะเบียนสมาชิก</a></li>
          <li class="nav-item"><a class="nav-link" href="login.html">เข้าสู่ระบบ</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- 🔹 Register Form -->
  <section class="container my-5">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="card shadow-lg">
          <div class="card-header bg-primary text-white text-center">
            <h4>📝 ลงทะเบียนสมาชิก</h4>
          </div>
          <div class="card-body">
            <form id="registerForm">
              <div class="mb-3">
                <label for="username" class="form-label">ชื่อผู้ใช้ (Username)</label>
                <input type="text" id="username" class="form-control" required>
              </div>

              <div class="mb-3">
                <label for="password" class="form-label">รหัสผ่าน (Password)</label>
                <input type="password" id="password" class="form-control" required>
              </div>

              <div class="mb-3">
                <label for="fullname" class="form-label">ชื่อ-นามสกุล</label>
                <input type="text" id="fullname" class="form-control" required>
              </div>

              <div class="mb-3">
                <label for="email" class="form-label">อีเมล</label>
                <input type="email" id="email" class="form-control" required>
              </div>

              <button type="submit" class="btn btn-primary w-100">สมัครสมาชิก</button>
            </form>

            <div id="message" class="mt-3 text-center"></div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <footer class="text-center py-3 bg-dark text-light">
    <small>© 2025 Smartwatch Promotion | Register Page</small>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="register.js"></script>
</body>
</html>
